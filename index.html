<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Starfleet Sorter</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #212529;
      --tos: #ffc107;
      --tng: #dc3545;
      --ds9: #6f42c1;
      --voy: #20c997;
      --ent: #0d6efd;
      --correct: #198754;
      --wrong: #fd7e14;
    }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
      touch-action: manipulation;
    }

    #app {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      box-sizing: border-box;
      margin-top: 10px;
    }

    h1, h2, h3 {
      text-align: center;
      margin-top: 0;
    }

    .screen {
      display: none;
    }
    .screen.active {
      display: block;
    }

    button {
      display: block;
      width: 100%;
      min-height: 56px; /* Great for tapping */
      margin: 12px 0;
      padding: 10px 16px;
      border-radius: 12px;
      border: none;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      color: white;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active:not(:disabled) {
      transform: scale(0.96);
    }
    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .btn-start, .btn-play-again { background-color: var(--correct); font-size: 1.25rem; }
    .btn-tos { background-color: var(--tos); color: black; }
    .btn-tng { background-color: var(--tng); }
    .btn-ds9 { background-color: var(--ds9); }
    .btn-voy { background-color: var(--voy); }
    .btn-ent { background-color: var(--ent); }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      background: #e9ecef;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 24px;
      font-size: 0.9rem;
      font-weight: bold;
    }
    .score-badge {
      padding: 4px 8px;
      border-radius: 4px;
    }
    .active-player {
      background-color: #000;
      color: #fff;
    }

    .turn-indicator {
      text-align: center;
      font-size: 1.2rem;
      color: #6c757d;
      margin-bottom: 8px;
    }

    .character-card {
      background: #f1f3f5;
      border: 3px solid #dee2e6;
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      font-size: 1.75rem;
      font-weight: bold;
      margin-bottom: 24px;
    }

    #feedback {
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 32px;
      margin-bottom: 16px;
    }

    .correct-text { color: var(--correct); animation: pop 0.4s ease-out; }
    .wrong-text { color: var(--wrong); animation: shake 0.4s ease-out; }

    .final-scores {
      font-size: 1.2rem;
      line-height: 2;
      margin: 20px 0;
      padding: 0;
      list-style: none;
    }
    .final-scores li {
      background: #f8f9fa;
      margin-bottom: 8px;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- START SCREEN -->
    <div id="start-screen" class="screen active">
      <h1>🖖 Starfleet Sorter</h1>
      <p style="font-size: 1.1rem; line-height: 1.5; text-align: center;">
        5 players share this screen and take turns. Sort the character into their correct Star Trek series. 
        <br><br>
        Guess correctly on your <strong>first try</strong> to score a point. 3 rounds total!
      </p>
      <button class="btn-start" onclick="startGame()">Start Game 🚀</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen">
      <div class="scoreboard" id="scoreboard">
        <!-- Generated by JS -->
      </div>
      
      <div class="turn-indicator" id="turn-indicator">Round 1 - Player 1's Turn</div>
      
      <div class="character-card" id="character-name">
        <!-- Character Name Goes Here -->
      </div>

      <div id="feedback"></div>

      <div id="series-buttons">
        <button class="btn-tos" onclick="checkAnswer('TOS')">The Original Series</button>
        <button class="btn-tng" onclick="checkAnswer('TNG')">The Next Generation</button>
        <button class="btn-ds9" onclick="checkAnswer('DS9')">Deep Space Nine</button>
        <button class="btn-voy" onclick="checkAnswer('VOY')">Voyager</button>
        <button class="btn-ent" onclick="checkAnswer('ENT')">Enterprise</button>
      </div>
    </div>

    <!-- END SCREEN -->
    <div id="end-screen" class="screen">
      <h1>Game Over! 🌟</h1>
      <h2 id="winner-announcement"></h2>
      <ul class="final-scores" id="final-scores-list">
        <!-- Generated by JS -->
      </ul>
      <button class="btn-play-again" onclick="startGame()">Play Again 🔄</button>
    </div>
  </div>

  <script>
    const characterDatabase = [
      { name: 'James T. Kirk', series: 'TOS' },
      { name: 'Spock', series: 'TOS' },
      { name: 'Leonard McCoy', series: 'TOS' },
      { name: 'Nyota Uhura', series: 'TOS' },
      { name: 'Hikaru Sulu', series: 'TOS' },
      { name: 'Jean-Luc Picard', series: 'TNG' },
      { name: 'Data', series: 'TNG' },
      { name: 'William Riker', series: 'TNG' },
      { name: 'Worf', series: 'TNG' },
      { name: 'Geordi La Forge', series: 'TNG' },
      { name: 'Benjamin Sisko', series: 'DS9' },
      { name: 'Kira Nerys', series: 'DS9' },
      { name: 'Odo', series: 'DS9' },
      { name: 'Quark', series: 'DS9' },
      { name: 'Jadzia Dax', series: 'DS9' },
      { name: 'Kathryn Janeway', series: 'VOY' },
      { name: 'Seven of Nine', series: 'VOY' },
      { name: 'The Doctor', series: 'VOY' },
      { name: 'Tuvok', series: 'VOY' },
      { name: 'Tom Paris', series: 'VOY' },
      { name: 'Jonathan Archer', series: 'ENT' },
      { name: 'T\'Pol', series: 'ENT' },
      { name: 'Charles "Trip" Tucker', series: 'ENT' },
      { name: 'Malcolm Reed', series: 'ENT' },
      { name: 'Hoshi Sato', series: 'ENT' }
    ];

    const TOTAL_PLAYERS = 5;
    const TOTAL_ROUNDS = 3;
    const TOTAL_TURNS = TOTAL_PLAYERS * TOTAL_ROUNDS;

    let scores = [];
    let currentTurnIndex = 0;
    let gameDeck = [];
    let firstTry = true;
    let buttonsLocked = false;

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function shuffle(array) {
      let currentIndex = array.length, randomIndex;
      while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
      }
      return array;
    }

    function startGame() {
      // Reset state
      scores = [0, 0, 0, 0, 0];
      currentTurnIndex = 0;
      buttonsLocked = false;
      
      // Shuffle and pick 15 characters
      let shuffled = shuffle([...characterDatabase]);
      gameDeck = shuffled.slice(0, TOTAL_TURNS);

      updateScoreboard();
      loadTurn();
      showScreen('game-screen');
    }

    function loadTurn() {
      if (currentTurnIndex >= TOTAL_TURNS) {
        endGame();
        return;
      }

      firstTry = true;
      buttonsLocked = false;
      
      const currentPlayer = (currentTurnIndex % TOTAL_PLAYERS) + 1;
      const currentRound = Math.floor(currentTurnIndex / TOTAL_PLAYERS) + 1;
      
      document.getElementById('turn-indicator').innerText = `Round ${currentRound} — Player ${currentPlayer}'s Turn!`;
      document.getElementById('character-name').innerText = gameDeck[currentTurnIndex].name;
      document.getElementById('feedback').className = '';
      document.getElementById('feedback').innerText = '';
      
      updateScoreboard();
    }

    function checkAnswer(selectedSeries) {
      if (buttonsLocked) return;
      
      const currentCharacter = gameDeck[currentTurnIndex];
      const feedbackDiv = document.getElementById('feedback');
      const currentPlayerIndex = currentTurnIndex % TOTAL_PLAYERS;

      // Force animation restart
      feedbackDiv.className = '';
      void feedbackDiv.offsetWidth; 

      if (selectedSeries === currentCharacter.series) {
        buttonsLocked = true;
        feedbackDiv.innerText = 'Correct! ✨';
        feedbackDiv.className = 'correct-text';
        
        if (firstTry) {
          scores[currentPlayerIndex]++;
          updateScoreboard();
        }

        setTimeout(() => {
          currentTurnIndex++;
          loadTurn();
        }, 1200);
      } else {
        firstTry = false;
        feedbackDiv.innerText = 'Not quite, try again! 💫';
        feedbackDiv.className = 'wrong-text';
      }
    }

    function updateScoreboard() {
      const currentPlayerIndex = currentTurnIndex % TOTAL_PLAYERS;
      const scoreboard = document.getElementById('scoreboard');
      scoreboard.innerHTML = '';
      
      for (let i = 0; i < TOTAL_PLAYERS; i++) {
        const badge = document.createElement('div');
        badge.className = 'score-badge';
        if (i === currentPlayerIndex) {
          badge.classList.add('active-player');
        }
        badge.innerText = `P${i + 1}: ${scores[i]}`;
        scoreboard.appendChild(badge);
      }
    }

    function endGame() {
      const finalScoresList = document.getElementById('final-scores-list');
      finalScoresList.innerHTML = '';
      
      let maxScore = -1;
      scores.forEach(s => { if (s > maxScore) maxScore = s; });

      let winners = [];
      scores.forEach((score, index) => {
        if (score === maxScore) winners.push(`Player ${index + 1}`);
        const li = document.createElement('li');
        li.innerHTML = `<span>Player ${index + 1}</span> <span>${score} pts</span>`;
        finalScoresList.appendChild(li);
      });

      const winnerAnnounce = document.getElementById('winner-announcement');
      if (winners.length === 1) {
        winnerAnnounce.innerText = `${winners[0]} wins! 🏆`;
      } else {
        winnerAnnounce.innerText = `It's a tie: ${winners.join(', ')}! 🏆`;
      }

      showScreen('end-screen');
    }
  </script>
</body>
</html>
